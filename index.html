<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小咖的维基</title>

    <!--
        域名根目录只是入口：立刻跳到维基首页。
        GitHub Pages 要求根目录必须有 index.html，所以这一页留着当跳转页，本身不算一个页面。
        它不在侧栏里出现（见 dsh-ui.js 的 WIKI.ignore）。
    -->
    <link rel="canonical" href="pages/首页/index.html">
    <meta http-equiv="refresh" content="0; url=pages/首页/index.html">
    <script>location.replace('pages/首页/index.html');</script>
</head>
<body>
    <p>正在前往<a href="pages/首页/index.html">首页</a>……</p>
</body>
</html>
